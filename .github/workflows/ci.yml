name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run checks & tests
        run: ./gradlew check --stacktrace

      - name: Verify CLI build
        run: ./gradlew :modules:spinochart-cli:installCli :modules:spinochart-cli:distZip

      - name: Test sample simulation
        run: ./gradlew :samples:sample-simulation:runSimulation
