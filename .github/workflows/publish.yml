name: 🚀 Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: 🦖 Release to the Wild
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Publish to Maven Central & Gradle Plugin Portal
        run: ./gradlew publish publishPlugins
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: Build standalone CLI binary
        run: ./gradlew :modules:spinochart-cli:installCli :modules:spinochart-cli:distZip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            modules/spinochart-cli/build/bin/spinochart
            modules/spinochart-cli/build/distributions/spinochart-cli-*.zip
            modules/spinochart-cli/build/libs/spinochart-cli-*-all.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
