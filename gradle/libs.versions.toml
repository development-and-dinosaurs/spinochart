[versions]
axionRelease = "1.21.1"
kotest = "6.0.7"
kotlin = "2.2.21"
spotless = "8.1.0"
gatling = "3.13.4"
gatlingGradle = "3.13.4"
clikt = "5.0.3"
vanniktechMavenPublish = "0.36.0"

[libraries]
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-framework-engine = { module = "io.kotest:kotest-framework-engine", version.ref = "kotest" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
plugin-kotlin-jvm = { module = "org.jetbrains.kotlin.jvm:org.jetbrains.kotlin.jvm.gradle.plugin", version.ref = "kotlin" }
plugin-spotless = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
plugin-vanniktech-mavenPublish = { module = "com.vanniktech.maven.publish:com.vanniktech.maven.publish.gradle.plugin", version.ref = "vanniktechMavenPublish" }
gatling-charts = { module = "io.gatling:gatling-charts", version.ref = "gatling" }
gatling-core = { module = "io.gatling:gatling-core", version.ref = "gatling" }
gatling-charts-highcharts = { module = "io.gatling.highcharts:gatling-charts-highcharts", version.ref = "gatling" }

[plugins]
axion-release = { id = "pl.allegro.tech.build.axion-release", version.ref = "axionRelease" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
gatling = { id = "io.gatling.gradle", version.ref = "gatlingGradle" }
gradle-publish = { id = "com.gradle.plugin-publish", version = "2.2.1" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish" }
